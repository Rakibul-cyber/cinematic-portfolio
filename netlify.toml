# Netlify configuration.
#
# Deliberately minimal, because Netlify's current guidance for Next.js is that
# "Next.js is supported natively on Netlify, and in most cases you will not need
# to install or configure anything" — the OpenNext adapter is provisioned
# automatically and owns the build output, the serverless and edge functions,
# ISR, on-demand revalidation, and image handling.
#
# Four things are therefore deliberately ABSENT, and each omission is
# load-bearing rather than an oversight:
#
#   * `[[plugins]] @netlify/plugin-nextjs`. Declaring it is the *pinning*
#     pattern, and Netlify explicitly recommends against pinning: "We actively
#     maintain the adapter to support all Next.js versions starting from version
#     13.5 and, if you don't pin the version, we will automatically use the
#     latest version on each project build for you."
#
#   * `publish`. The adapter decides where build output lives. Naming a
#     directory here freezes an assumption about the adapter's internals, and
#     the failure mode when it drifts is a green deploy that serves 404s.
#
#   * Security headers. They are produced by `securityHeaders()` in
#     src/lib/security-headers.ts and emitted by Next.js itself, so they apply
#     identically to `next dev`, `next start`, and Netlify, and the
#     Content-Security-Policy can react to which services are configured.
#     Repeating any of them here would create a second source of truth that
#     drifts. `npm run deploy:verify` fails if one appears in this file.
#
#   * Cache headers on rendered routes. Incremental Static Regeneration works by
#     letting the Next.js runtime own `Cache-Control` and `Netlify-CDN-Cache-
#     Control` on anything it renders — including `/sitemap.xml`, `/robots.txt`,
#     and `/opengraph-image`, which are Next.js metadata routes with their own
#     `revalidate`, not static files. A CDN rule on any of them would freeze
#     stale output and make on-demand revalidation invisible.
#
# The Node.js version lives in `.node-version`, which is the highest-precedence
# mechanism Netlify reads and is visible to every other tool in the repository.
#
# Environment variables are configured in the Netlify UI, never in this file.

[build]
  # Netlify would detect this from package.json; stating it keeps the build
  # reproducible if framework detection is ever ambiguous.
  command = "npm run build"

[build.environment]
  # Dev dependencies are required at build time: Prisma generates the client in
  # `postinstall`, and TypeScript and Tailwind run during `next build`.
  NPM_FLAGS = "--include=dev"

# Build output addressed by content hash — including the fonts `next/font`
# emits to `/_next/static/media/`. Safe to cache forever, and the single largest
# win available to a returning visitor. This is the only path in the deployment
# whose contents can never change under a given URL.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The one deliberate exception to "rendered routes are the runtime's to cache".
# The application already sends this on every admin response; stating it at the
# edge as well is fail-safe in the only direction that matters — over-restricting
# a private surface cannot leak it, while under-restricting one can.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store"
